<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Налаштування · ScalpTerm</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="settings.css">
  <script src="settings.js" defer></script>
</head>
<body class="settings-window">
  <div class="settings-shell">
    <header class="settings-heading">
      <div class="settings-app-name">ScalpTerm <span>Налаштування</span></div>
      <h1 id="window-title"></h1>
      <p id="window-description"></p>
    </header>
    <nav id="settings-tabs" class="settings-tabs" role="tablist" aria-label="Підкатегорії"></nav>
    <main id="settings-content" class="settings-content"></main>
    <footer class="settings-footer">
      <span id="settings-feedback" role="status" aria-live="polite">Завантаження налаштувань…</span>
      <button id="close-window" type="button">Закрити</button>
    </footer>
  </div>
</body>
</html>
